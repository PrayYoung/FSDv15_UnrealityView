name: Tests
on: [push, pull_request]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --locked --extra dev --extra realdata
      - run: uv run --no-sync pytest -q
      - run: node --check app/static/app.js

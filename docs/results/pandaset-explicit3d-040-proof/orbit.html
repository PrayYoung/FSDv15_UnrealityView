<!doctype html><meta charset="utf-8"><title>Scene040 discrete orbit check</title><p>Three sampled orbit views, not continuous3D. Frame55, poseB; drag the image or use slider.</p><select id="source"><option>camera_only</option><option>lidar_anchored</option></select><select id="kind"><option>difix</option><option>raw</option></select><input id="angle" type="range" min="0" max="2" value="1" step="1"><span id="label"></span><br><img id="view" width="640" draggable="false"><script>const a=document.getElementById('angle'),s=document.getElementById('source'),k=document.getElementById('kind'),v=document.getElementById('view');function update(){const y=['-25','+00','+25'][+a.value];v.src='orbit/'+s.value+'_'+y+'_'+k.value+'.png';document.getElementById('label').textContent=y+' degrees'}[a,s,k].forEach(x=>x.oninput=update);let start;v.onpointerdown=e=>{start=e.clientX;v.setPointerCapture(e.pointerId)};v.onpointermove=e=>{if(start!==undefined){a.value=Math.max(0,Math.min(2,1+Math.round((e.clientX-start)/80)));update()}};v.onpointerup=()=>start=undefined;update()</script>

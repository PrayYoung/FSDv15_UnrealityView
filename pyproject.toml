[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unrealityview"
version = "0.1.0"
description = "UnrealityView: camera-conditioned video generation with isolated planning and composable style adapters"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.5.1", "torchvision==0.20.1", "timm==1.0.15",
  "diffusers==0.32.2", "safetensors>=0.5,<1", "numpy==1.26.4",
  "pillow>=11,<13", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3", "huggingface-hub>=0.27,<1",
]

[project.optional-dependencies]
realdata = ["pyarrow>=17,<24", "opencv-python-headless>=4.9,<4.12", "fsspec[http]>=2024.10,<2027"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/unrealityview", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pretrained: requires downloaded pretrained model weights"]


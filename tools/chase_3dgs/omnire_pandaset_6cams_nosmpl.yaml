# Overlay merged into pinned configs/omnire.yaml + datasets/pandaset/6cams.yaml.
# The builder removes SMPLNodes, CamPose and the dataset shortcut explicitly.
data:
  dataset: pandaset
  pixel_source:
    cameras: [0, 1, 2, 3, 4, 5]
    load_smpl: false
    test_image_stride: 10
  lidar_source:
    load_lidar: true
model:
  Background:
    init:
      from_lidar:
        num_samples: 800000
        return_color: true
      near_randoms: 100000
      far_randoms: 100000
trainer:
  optim:
    num_iters: 15000
logging:
  vis_freq: -1
  print_freq: 500
  saveckpt_freq: 5000
render:
  render_full: false
  render_test: true
